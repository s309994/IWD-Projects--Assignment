<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
        <meta charset="utf-8"/>
        <title>onTV</title>
        <script src="https://cdn.tailwindcss.com"></script>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="./style.css"/>

        <script src="https://kit.fontawesome.com/027828918f.js" crossorigin="anonymous"></script>

    </head>

    <body id="home-page">
         <nav class="nav-bar bg-black border-b border-gray-300" >
            <div class="container mx-auto px-4 flex items-center gap-4 py-2">
                <a class="text-4xl tracking-wider font-semibold text-yellow-300 brand-link" href="index.html">onTV</a>
                    
                    <button class="md:hidden items-center p-2 rounded text-gray-800 hover:bg-gray-200 ml-auto" onclick="this.nextElementSibling.classList.toggle('hidden')">

                        <i class="fa-solid fa-bars"></i>
                    </button>

                    <div class="hidden md:block" id="navbarNav">
                        <ul class="flex flex-col md:flex-row gap-2 md:gap-4">
                            <li>
                                <a class="text-gray-700 hover:text-yellow-400" href="shows.html">Shows</a>
                            </li>
                            <li>
                                <a class="text-gray-700 hover:text-yellow-400" href="people.html">People</a>
                            </li>
                            <li>
                                <a class="text-gray-300 hover:text-yellow-400" href="search.html">Search</a>
                            </li>
                        </ul>
                    </div>
            </div>
        </nav>

        <div class="p-12 mb-4 bg-gray-100 jumbotron">
            <div>
                <h1 class="text-5xl font-bold">Welcome to onTv</h1>
                <form id="search-form" class="mt-4 max-w-md" onSubmit="searchShow(event)">
                    <div class="grid grid-cols-6 gap-2 items-center">
                        <input type="text" id="keywords" placeholder="Enter search here…" class="col-span-4 w-full border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                        <button type="submit" class="col-span-1 bg-blue-500 text-white px-2 py-1 text-sm rounded hover:bg-blue-600">
                        Search
                        </button>
                    </div>
                </form>
                <div id="results" class="grid grid-cols-1 md:grid-cols-3 gap-8 mt-4"></div>
            </div>

        </div>

        <script src="./js/search.js"></script>


    </body>
</html>
